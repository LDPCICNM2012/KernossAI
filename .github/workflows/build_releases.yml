name: Build Multiplatform Releases

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux Binary
        run: |
          bash scripts/build_linux.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KernossAI-Linux-x86_64
          path: |
            dist/KernossAI_Linux_x86_64.tar.gz

  build-windows:
    name: Build Windows (.exe & Setup Installer)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows Executable (.exe)
        run: |
          python scripts/build_desktop.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes

      - name: Compile Inno Setup Installer (.exe Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
              $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          & $iscc installer_windows.iss

      - name: Compress Windows Portable Bundle (.zip)
        shell: pwsh
        run: |
          Compress-Archive -Path dist/KernossAI/* -DestinationPath dist/installer/KernossAI_Windows_Portable_x64.zip -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KernossAI-Windows-x64
          path: |
            dist/installer/KernossAI_Windows_Setup_x64.exe
            dist/installer/KernossAI_Windows_Portable_x64.zip

  build-macos:
    name: Build macOS (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
            name: Intel (x86_64 - Sequoia)
            artifact_name: KernossAI-macOS-Intel-x64
            dmg_name: KernossAI_macOS_Intel_x64.dmg
          - os: macos-15
            arch: arm64
            name: Apple Silicon (arm64 - Sequoia)
            artifact_name: KernossAI-macOS-AppleSilicon-arm64
            dmg_name: KernossAI_macOS_AppleSilicon_arm64.dmg
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS Application and DMG Installer
        env:
          MAC_ARCH: ${{ matrix.arch }}
          DMG_OUTPUT_NAME: ${{ matrix.dmg_name }}
        run: |
          bash scripts/build_macos.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.dmg_name }}

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: KernossAI-Linux-x86_64
          path: release_assets/linux

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: KernossAI-Windows-x64
          path: release_assets/windows

      - name: Download macOS Intel Artifacts
        uses: actions/download-artifact@v4
        with:
          name: KernossAI-macOS-Intel-x64
          path: release_assets/macos_intel

      - name: Download macOS Apple Silicon Artifacts
        uses: actions/download-artifact@v4
        with:
          name: KernossAI-macOS-AppleSilicon-arm64
          path: release_assets/macos_arm64

      - name: Prepare Release Files
        run: |
          mkdir -p release_dist
          # Buscar y copiar todos los ejecutables e instaladores construidos
          find release_assets -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.tar.gz" -o -name "*.zip" \) -exec cp -v {} release_dist/ \;
          # Si existe instalador para Apple Silicon o Intel, crear copia universal genérica
          if [ -f release_dist/KernossAI_macOS_AppleSilicon_arm64.dmg ]; then
            cp -v release_dist/KernossAI_macOS_AppleSilicon_arm64.dmg release_dist/KernossAI_macOS_Installer.dmg
          elif [ -f release_dist/KernossAI_macOS_Intel_x64.dmg ]; then
            cp -v release_dist/KernossAI_macOS_Intel_x64.dmg release_dist/KernossAI_macOS_Installer.dmg
          fi
          # Arch Linux PKGBUILD
          cp -v PKGBUILD release_dist/
          echo "=== ARCHIVOS A PUBLICAR EN LA RELEASE ==="
          ls -la release_dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_dist/*
          title: "KernossAI Release ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
