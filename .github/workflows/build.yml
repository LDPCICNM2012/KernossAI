name: Build KernosIA

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ══════════════════════════════
  # WINDOWS → KernosIA-Windows.exe
  # ══════════════════════════════
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install pyinstaller customtkinter openai google-generativeai python-docx Pillow

      - name: Compilar con PyInstaller
        run: |
          pyinstaller --onefile --windowed --icon=main/logo.ico --name="KernosIA-Windows" --collect-data customtkinter main/main.py

      - name: Subir al Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KernosIA-Windows.exe

  # ══════════════════════════════
  # MACOS → KernosIA-MacOs.zip
  # ══════════════════════════════
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install pyinstaller customtkinter openai google-generativeai python-docx Pillow

      - name: Compilar con PyInstaller
        run: |
          pyinstaller --onedir --windowed --icon=main/logo.icns --name="KernosIA" --collect-data customtkinter main/main.py

      - name: Empaquetar en .zip
        run: |
          cd dist
          zip -r KernosIA-MacOs.zip KernosIA.app

      - name: Subir al Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KernosIA-MacOs.zip

  # ══════════════════════════════
  # LINUX → KernosIA-Linux
  # ══════════════════════════════
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del sistema (para tkinter)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Instalar dependencias Python
        run: |
          pip install pyinstaller customtkinter openai google-generativeai python-docx Pillow

      - name: Compilar con PyInstaller
        run: |
          pyinstaller --onefile --windowed --name="KernosIA-Linux" --collect-data customtkinter main/main.py

      - name: Subir al Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KernosIA-Linux