name: Build KernosIA

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ══════════════════════════════
  # WINDOWS → KernosIA-Windows.exe
  # ══════════════════════════════
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install pyinstaller customtkinter openai google-generativeai python-docx Pillow

      - name: Compilar con PyInstaller
        run: |
          pyinstaller --onefile --windowed --icon=logo.ico --name="KernosIA-Windows" --collect-data customtkinter main.py

      - name: Subir al Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KernosIA-Windows.exe

  # ══════════════════════════════
  # MACOS → KernosIA-MacOs.zip
  # ══════════════════════════════
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install pyinstaller customtkinter openai google-generativeai python-docx Pillow

      - name: Convertir logo.ico a logo.icns
        run: |
          python -c "from PIL import Image; Image.open('logo.ico').save('logo.png')"
          mkdir -p logo.iconset
          sips -z 16 16     logo.png --out logo.iconset/icon_16x16.png
          sips -z 32 32     logo.png --out logo.iconset/icon_16x16@2x.png
          sips -z 32 32     logo.png --out logo.iconset/icon_32x32.png
          sips -z 64 64     logo.png --out logo.iconset/icon_32x32@2x.png
          sips -z 128 128   logo.png --out logo.iconset/icon_128x128.png
          sips -z 256 256   logo.png --out logo.iconset/icon_128x128@2x.png
          sips -z 256 256   logo.png --out logo.iconset/icon_256x256.png
          sips -z 512 512   logo.png --out logo.iconset/icon_512x512.png
          sips -z 512 512   logo.png --out logo.iconset/icon_512x512@2x.png
          sips -z 1024 1024 logo.png --out logo.iconset/icon_512x512@2x.png
          iconutil -c icns logo.iconset -o logo.icns

      - name: Compilar con PyInstaller
        run: |
          pyinstaller --onedir --windowed --icon=logo.icns --name="KernosIA" --collect-data customtkinter main.py

      - name: Empaquetar en .zip
        run: |
          cd dist
          zip -r KernosIA-MacOs.zip KernosIA.app

      - name: Subir al Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KernosIA-MacOs.zip

  # ══════════════════════════════
  # LINUX → KernosIA-Linux
  # ══════════════════════════════
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del sistema (para tkinter)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Instalar dependencias Python
        run: |
          pip install pyinstaller customtkinter openai google-generativeai python-docx Pillow

      - name: Compilar con PyInstaller
        run: |
          pyinstaller --onefile --windowed --name="KernosIA-Linux" --collect-data customtkinter main.py

      - name: Subir al Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KernosIA-Linux