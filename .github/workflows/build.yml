name: Compilar App Multiplataforma (Windows, Linux, macOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Compilar para ${{ matrix.os }}
    strategy:
      matrix:
        # Genera las 3 versiones al mismo tiempo
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar soporte para GUI / Tkinter (Solo para Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller matplotlib python-docx google-genai google-generativeai python-dotenv customtkinter openai

    - name: Compilar con PyInstaller (Solución de módulos para todos los S.O.)
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        pyinstaller --onefile --noconsole --collect-all matplotlib --collect-all customtkinter main.py

    - name: Guardar ejecutable generado (Artefacto)
      uses: actions/upload-artifact@v4
      with:
        name: ejecutable-${{ matrix.os }}
        path: dist/