name: Compilar App con PyInstaller

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Si quieres generar ejecutable para Mac cambia a 'macos-latest', o 'windows-latest' para .exe
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar soporte para GUI / Tkinter (Requerido para CustomTkinter en Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk

    - name: Instalar todas las dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller matplotlib python-docx google-genai google-generativeai python-dotenv customtkinter openai

    - name: Compilar con PyInstaller
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        pyinstaller --onefile --noconsole main.py

    - name: Guardar ejecutable generado (Artefacto)
      uses: actions/upload-artifact@v4
      with:
        name: ejecutable-compilado
        path: dist/